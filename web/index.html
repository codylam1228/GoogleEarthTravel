<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Earth Travel Web Suite</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; background: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; position: relative; }
        .drop-zone { border: 2px dashed #007bff; padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; background: #f0f7ff; }
        .drop-zone.hover { background: #e2f0ff; border-color: #0056b3; }
        .btn { display: inline-block; padding: 10px 20px; background: #28a745; color: white; border-radius: 5px; cursor: pointer; border: none; text-decoration: none; font-size: 16px; }
        .btn-earth { background: #4285f4; margin-left: 10px; }
        .lang-btn { position: absolute; top: 20px; right: 20px; background: #6c757d; color: white; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
        select, input { padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        #status { font-weight: bold; color: #333; margin-top: 10px; }
        .error { color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
<body>

    <div class="card">
        <button class="lang-btn" id="langToggle">繁體中文</button>
        <h2 id="appTitle">🌍 GoogleEarthTravel All-in-One Web Suite</h2>
        <p id="appSub">100% Client-side processing (Pyodide WebAssembly). No server uploads.</p>
        <div id="status">⏳ Loading Python WASM Runtime...</div>
    </div>

    <div class="card">
        <h3 id="step1Title">Step 1: Select Operation</h3>
        <select id="modeSelect">
            <option value="gpx">1. GPX to KML Converter (.gpx)</option>
            <option value="json">2. Google Timeline JSON to KML Converter (.json)</option>
            <option value="repair">3. Repair KML Track (.kml)</option>
            <option value="split">4. Split KML Track (.kml)</option>
        </select>

        <div id="splitLimitGroup" style="display:none; margin-top: 10px;">
            <label for="splitLimit"><strong id="splitLimitLabel">Max Points per Split Segment:</strong></label>
            <input type="number" id="splitLimit" value="2000" min="10">
        </div>
    </div>

    <div class="card">
        <h3 id="step2Title">Step 2: Upload File</h3>
        <div class="drop-zone" id="dropZone">
            <span id="dropText">Click to upload or drag & drop file (.gpx)</span>
            <input type="file" id="fileInput" accept=".gpx" style="display: none;">
        </div>
    </div>

    <div class="card" id="actionArea" style="display: none;">
        <h3 id="step3Title">Step 3: Export Result</h3>
        <button class="btn" id="downloadBtn">📥 Download Converted .KML</button>
        <a href="https://earth.google.com/web/" target="_blank" class="btn btn-earth" id="earthBtn">🚀 Open Google Earth Web</a>
    </div>

    <script>
        const pythonCoreScript = `
import xml.etree.ElementTree as ET
import json
import re

KML = "http://www.opengis.net/kml/2.2"
GX = "http://www.google.com/kml/ext/2.2"
NS = {"k": KML, "gx": GX}

def process_file(file_content, mode, split_limit=2000):
    if mode == "gpx":
        ns = {'gpx': 'http://www.topografix.com/GPX/1/1'}
        try:
            root = ET.fromstring(file_content)
        except Exception as e:
            return f"Error parsing GPX: {str(e)}"

        kml_header = '''<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Converted Track</name>
    <Style id="trackStyle">
      <LineStyle><color>ff0000ff</color><width>4</width></LineStyle>
    </Style>\\n'''
        kml_footer = '  </Document>\\n</kml>'
        kml_body = []

        for trk in root.findall('.//gpx:trk', ns):
            for trkseg in trk.findall('gpx:trkseg', ns):
                coords = [f"{pt.attrib.get('lon')},{pt.attrib.get('lat')},0" for pt in trkseg.findall('gpx:trkpt', ns) if 'lon' in pt.attrib and 'lat' in pt.attrib]
                if coords:
                    coord_str = " ".join(coords)
                    kml_body.append(f"    <Placemark>\\n      <name>Track Segment</name>\\n      <styleUrl>#trackStyle</styleUrl>\\n      <LineString><tessellate>1</tessellate><coordinates>{coord_str}</coordinates></LineString>\\n    </Placemark>")
        return kml_header + "\\n".join(kml_body) + "\\n" + kml_footer

    elif mode == "json":
        try:
            data = json.loads(file_content)
        except Exception as e:
            return f"Error parsing JSON: {str(e)}"
        
        kml_header = '''<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Timeline Track</name>
    <Style id="trackStyle">
      <LineStyle><color>ff0000ff</color><width>4</width></LineStyle>
    </Style>\\n'''
        kml_footer = '  </Document>\\n</kml>'
        kml_body = []

        if isinstance(data, list):
            for item in data:
                if isinstance(item, dict) and "activity" in item:
                    act = item["activity"]
                    s_geo, e_geo = act.get("start", ""), act.get("end", "")
                    if isinstance(s_geo, str) and isinstance(e_geo, str) and s_geo.startswith("geo:") and e_geo.startswith("geo:"):
                        s_lat, s_lon = s_geo[4:].split(",", 1)
                        e_lat, e_lon = e_geo[4:].split(",", 1)
                        kml_body.append(f"    <Placemark>\\n      <name>Activity</name>\\n      <styleUrl>#trackStyle</styleUrl>\\n      <LineString><coordinates>{s_lon},{s_lat},0 {e_lon},{e_lat},0</coordinates></LineString>\\n    </Placemark>")
        return kml_header + "\\n".join(kml_body) + "\\n" + kml_footer

    elif mode == "repair":
        try:
            root = ET.fromstring(file_content)
        except Exception as e:
            return f"Error parsing KML: {str(e)}"

        points = []
        for pm in root.iter(f"{{{KML}}}Placemark"):
            track = pm.find(".//gx:Track", NS)
            if track is not None:
                coords = [c.text.strip().replace(" ", ",") for c in track.findall("gx:coord", NS) if c.text]
                points.extend(coords)
            else:
                coord_el = pm.find(".//k:LineString/k:coordinates", NS)
                if coord_el is not None and coord_el.text:
                    points.extend(coord_el.text.strip().split())

        if not points:
            return "Error: No track points found in KML."

        kml = f'''<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="{KML}" xmlns:gx="{GX}">
<Document>
  <name>Repaired KML Track</name>
  <Style id="track"><LineStyle><color>ff0000ff</color><width>4</width></LineStyle></Style>
  <Placemark>
    <name>Repaired Route</name>
    <styleUrl>#track</styleUrl>
    <LineString>
      <altitudeMode>clampToGround</altitudeMode>
      <tessellate>1</tessellate>
      <coordinates>{" ".join(points)}</coordinates>
    </LineString>
  </Placemark>
</Document>
</kml>'''
        return kml

    elif mode == "split":
        try:
            root = ET.fromstring(file_content)
        except Exception as e:
            return f"Error parsing KML: {str(e)}"

        points = []
        for pm in root.iter(f"{{{KML}}}Placemark"):
            track = pm.find(".//gx:Track", NS)
            if track is not None:
                coords = [c.text.strip().replace(" ", ",") for c in track.findall("gx:coord", NS) if c.text]
                points.extend(coords)
            else:
                coord_el = pm.find(".//k:LineString/k:coordinates", NS)
                if coord_el is not None and coord_el.text:
                    points.extend(coord_el.text.strip().split())

        if not points:
            return "Error: No track points found in KML."

        chunk_size = int(split_limit)
        placemarks = []

        for i in range(0, len(points), chunk_size):
            chunk = points[i:i + chunk_size]
            part_num = (i // chunk_size) + 1
            placemarks.append(f'''  <Placemark>
    <name>Track Part {part_num}</name>
    <styleUrl>#track</styleUrl>
    <LineString>
      <altitudeMode>clampToGround</altitudeMode>
      <tessellate>1</tessellate>
      <coordinates>{" ".join(chunk)}</coordinates>
    </LineString>
  </Placemark>''')

        kml = f'''<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="{KML}" xmlns:gx="{GX}">
<Document>
  <name>Split KML Track</name>
  <Style id="track"><LineStyle><color>ff0000ff</color><width>4</width></LineStyle></Style>
\\n{"\\n".join(placemarks)}
</Document>
</kml>'''
        return kml

    return "Invalid mode"
`;

        const translations = {
            en: {
                toggleBtn: "繁體中文",
                appTitle: "🌍 GoogleEarthTravel All-in-One Web Suite",
                appSub: "100% Client-side processing (Pyodide WebAssembly). No server uploads.",
                statusLoading: "⏳ Loading Python WASM Runtime...",
                statusReady: "✅ Ready. Pyodide loaded.",
                statusProcessing: "⚙️ Processing...",
                step1Title: "Step 1: Select Operation",
                step2Title: "Step 2: Upload File",
                step3Title: "Step 3: Export Result",
                splitLimitLabel: "Max Points per Split Segment:",
                dropTexts: {
                    gpx: "Click to upload or drag & drop file (.gpx)",
                    json: "Click to upload or drag & drop file (.json)",
                    repair: "Click to upload or drag & drop file (.kml)",
                    split: "Click to upload or drag & drop file (.kml)"
                },
                downloadBtn: "📥 Download Converted .KML",
                earthBtn: "🚀 Open Google Earth Web",
                options: [
                    "1. GPX to KML Converter (.gpx)",
                    "2. Google Timeline JSON to KML Converter (.json)",
                    "3. Repair KML Track (.kml)",
                    "4. Split KML Track (.kml)"
                ]
            },
            zh: {
                toggleBtn: "English",
                appTitle: "🌍 GoogleEarthTravel 全功能網頁工具",
                appSub: "100% 本地客戶端處理 (Pyodide WebAssembly)，無需上傳伺服器。",
                statusLoading: "⏳ 正在載入 Python WASM 運行環境...",
                statusReady: "✅ 準備就緒。Pyodide 已成功載入。",
                statusProcessing: "⚙️ 處理中...",
                step1Title: "第一步：選擇操作項目",
                step2Title: "第二步：上傳檔案",
                step3Title: "第三步：匯出結果",
                splitLimitLabel: "每個切分軌跡段的最大點數限制：",
                dropTexts: {
                    gpx: "點擊上傳或將檔案拖放至此 (.gpx)",
                    json: "點擊上傳或將檔案拖放至此 (.json)",
                    repair: "點擊上傳或將檔案拖放至此 (.kml)",
                    split: "點擊上傳或將檔案拖放至此 (.kml)"
                },
                downloadBtn: "📥 下載轉換後的 .KML 檔案",
                earthBtn: "🚀 開啟 Google Earth 網頁版",
                options: [
                    "1. GPX 轉 KML 轉換器 (.gpx)",
                    "2. Google Timeline JSON 轉 KML 轉換器 (.json)",
                    "3. 修復 KML 軌跡 (.kml)",
                    "4. 切分 KML 軌跡 (.kml)"
                ]
            }
        };

        let currentLang = 'en';
        let pyodide = null;
        let convertedData = "";
        let outputFileName = "output.kml";

        const langToggle = document.getElementById('langToggle');
        const statusEl = document.getElementById('status');
        const modeSelect = document.getElementById('modeSelect');
        const splitLimitGroup = document.getElementById('splitLimitGroup');
        const dropZone = document.getElementById('dropZone');
        const dropText = document.getElementById('dropText');
        const fileInput = document.getElementById('fileInput');
        const actionArea = document.getElementById('actionArea');

        function updateAcceptTypes() {
            const mode = modeSelect.value;
            splitLimitGroup.style.display = (mode === 'split') ? 'block' : 'none';
            dropText.innerText = translations[currentLang].dropTexts[mode];

            if (mode === 'gpx') fileInput.accept = ".gpx";
            else if (mode === 'json') fileInput.accept = ".json";
            else if (mode === 'repair' || mode === 'split') fileInput.accept = ".kml";
        }

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            langToggle.innerText = t.toggleBtn;
            document.getElementById('appTitle').innerText = t.appTitle;
            document.getElementById('appSub').innerText = t.appSub;
            document.getElementById('step1Title').innerText = t.step1Title;
            document.getElementById('step2Title').innerText = t.step2Title;
            document.getElementById('step3Title').innerText = t.step3Title;
            document.getElementById('splitLimitLabel').innerText = t.splitLimitLabel;
            document.getElementById('downloadBtn').innerText = t.downloadBtn;
            document.getElementById('earthBtn').innerText = t.earthBtn;

            for (let i = 0; i < modeSelect.options.length; i++) {
                modeSelect.options[i].text = t.options[i];
            }
            updateAcceptTypes();
            if (pyodide) {
                statusEl.innerText = t.statusReady;
            }
        }

        langToggle.onclick = () => {
            setLanguage(currentLang === 'en' ? 'zh' : 'en');
        };

        async function initPyodide() {
            try {
                pyodide = await loadPyodide();
                pyodide.runPython(pythonCoreScript);
                statusEl.className = "success";
                statusEl.innerText = translations[currentLang].statusReady;
            } catch (err) {
                statusEl.className = "error";
                statusEl.innerText = "❌ Load failed: " + err.message;
            }
        }
        initPyodide();

        modeSelect.addEventListener('change', updateAcceptTypes);

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('hover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        async function handleFile(file) {
            if (!file || !pyodide) return;

            const mode = modeSelect.value;
            const fileExt = file.name.split('.').pop().toLowerCase();

            if ((mode === 'repair' || mode === 'split') && fileExt !== 'kml') {
                alert(currentLang === 'zh' ? "此模式僅支援上傳 .kml 檔案！" : "This mode requires a .kml file!");
                return;
            }
            if (mode === 'gpx' && fileExt !== 'gpx') {
                alert(currentLang === 'zh' ? "此模式僅支援上傳 .gpx 檔案！" : "This mode requires a .gpx file!");
                return;
            }
            if (mode === 'json' && fileExt !== 'json') {
                alert(currentLang === 'zh' ? "此模式僅支援上傳 .json 檔案！" : "This mode requires a .json file!");
                return;
            }

            const splitLimit = parseInt(document.getElementById('splitLimit').value, 10) || 2000;

            statusEl.className = "";
            statusEl.innerText = translations[currentLang].statusProcessing;
            actionArea.style.display = "none";

            setTimeout(async () => {
                try {
                    const content = await file.text();
                    
                    pyodide.globals.set("f_content", content);
                    pyodide.globals.set("f_mode", mode);
                    pyodide.globals.set("f_limit", splitLimit);

                    convertedData = pyodide.runPython("process_file(f_content, f_mode, f_limit)");

                    if (convertedData.startsWith("Error")) {
                        throw new Error(convertedData);
                    }

                    outputFileName = file.name.replace(/\.[^/.]+$/, "") + `_${mode}.kml`;
                    statusEl.className = "success";
                    statusEl.innerText = (currentLang === 'zh' ? "✅ 成功！輸出完成：" : "✅ Success! Output ready: ") + outputFileName;
                    actionArea.style.display = "block";
                } catch (err) {
                    statusEl.className = "error";
                    statusEl.innerText = "❌ Error: " + err.message;
                }
            }, 50);
        }

        document.getElementById('downloadBtn').onclick = () => {
            const blob = new Blob([convertedData], { type: 'application/vnd.google-earth.kml+xml' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = outputFileName;
            a.click();
        };
    </script>
</body>
</html>
