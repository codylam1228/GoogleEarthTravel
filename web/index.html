<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Earth Travel - All-in-One Web Suite</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; background: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .drop-zone { border: 2px dashed #007bff; padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; background: #f0f7ff; }
        .drop-zone.hover { background: #e2f0ff; border-color: #0056b3; }
        .btn { display: inline-block; padding: 10px 20px; background: #28a745; color: white; border-radius: 5px; cursor: pointer; border: none; text-decoration: none; font-size: 16px; }
        .btn-earth { background: #4285f4; margin-left: 10px; }
        select, input { padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        #status { font-weight: bold; color: #333; margin-top: 10px; }
        .error { color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌍 GoogleEarthTravel All-in-One Web Suite</h2>
        <p>100% Client-side processing (Pyodide WebAssembly). No server uploads.</p>
        <div id="status">⏳ Loading Python WASM Runtime...</div>
    </div>

    <div class="card">
        <h3>Step 1: Select Operation</h3>
        <select id="modeSelect">
            <option value="gpx">1. GPX to KML</option>
            <option value="json">2. Google Timeline JSON to KML</option>
            <option value="prune">3. Prune KML by Date</option>
            <option value="repair">4. Repair KML Track</option>
            <option value="split">5. Split KML Track</option>
        </select>

        <div id="dateInputGroup" style="display:none; margin-top: 10px;">
            <label for="targetDate"><strong>Target Date Filter (e.g., YYYY-MM-DD):</strong></label>
            <input type="text" id="targetDate" placeholder="2026-04-15">
        </div>
    </div>

    <div class="card">
        <h3>Step 2: Upload File</h3>
        <div class="drop-zone" id="dropZone">
            Click to upload or drag & drop file (.gpx / .json / .kml)
            <input type="file" id="fileInput" style="display: none;">
        </div>
    </div>

    <div class="card" id="actionArea" style="display: none;">
        <h3>Step 3: Export Result</h3>
        <button class="btn" id="downloadBtn">📥 Download Converted .KML</button>
        <a href="https://earth.google.com/web/" target="_blank" class="btn btn-earth">🚀 Open Google Earth Web</a>
    </div>

    <script>
        const pythonCoreScript = `
import xml.etree.ElementTree as ET
import json

def process_file(file_content, mode, target_date=""):
    if mode == "gpx":
        ns = {'gpx': 'http://www.topografix.com/GPX/1/1'}
        try:
            root = ET.fromstring(file_content)
        except Exception as e:
            return f"Error parsing GPX: {str(e)}"

        kml_header = '<?xml version="1.0" encoding="UTF-8"?>\\n<kml xmlns="http://www.opengis.net/kml/2.2">\\n<Document>\\n<name>Converted Track</name>\\n'
        kml_footer = '</Document>\\n</kml>'
        kml_body = []

        for trk in root.findall('.//gpx:trk', ns):
            for trkseg in trk.findall('gpx:trkseg', ns):
                coords = [f"{pt.attrib.get('lon')},{pt.attrib.get('lat')},0" for pt in trkseg.findall('gpx:trkpt', ns) if 'lon' in pt.attrib and 'lat' in pt.attrib]
                if coords:
                    coord_str = " ".join(coords)
                    kml_body.append(f"  <Placemark>\\n    <name>Track Segment</name>\\n    <LineString><tessellate>1</tessellate><coordinates>{coord_str}</coordinates></LineString>\\n  </Placemark>")
        return kml_header + "\\n".join(kml_body) + "\\n" + kml_footer

    elif mode == "json":
        try:
            data = json.loads(file_content)
        except Exception as e:
            return f"Error parsing JSON: {str(e)}"
        
        kml_header = '<?xml version="1.0" encoding="UTF-8"?>\\n<kml xmlns="http://www.opengis.net/kml/2.2">\\n<Document>\\n<name>Timeline Track</name>\\n'
        kml_footer = '</Document>\\n</kml>'
        kml_body = []

        if isinstance(data, list):
            for item in data:
                if isinstance(item, dict) and "activity" in item:
                    act = item["activity"]
                    s_geo, e_geo = act.get("start", ""), act.get("end", "")
                    if isinstance(s_geo, str) and isinstance(e_geo, str) and s_geo.startswith("geo:") and e_geo.startswith("geo:"):
                        s_lat, s_lon = s_geo[4:].split(",", 1)
                        e_lat, e_lon = e_geo[4:].split(",", 1)
                        kml_body.append(f"  <Placemark>\\n    <name>Activity</name>\\n    <LineString><coordinates>{s_lon},{s_lat},0 {e_lon},{e_lat},0</coordinates></LineString>\\n  </Placemark>")
        return kml_header + "\\n".join(kml_body) + "\\n" + kml_footer

    elif mode == "prune":
        try:
            root = ET.fromstring(file_content)
        except Exception as e:
            return f"Error parsing KML: {str(e)}"
        
        ns = {'kml': 'http://www.opengis.net/kml/2.2'}
        ET.register_namespace('', 'http://www.opengis.net/kml/2.2')
        
        for parent in root.findall('.//kml:Document', ns) + root.findall('.//kml:Folder', ns):
            for pm in list(parent.findall('kml:Placemark', ns)):
                text = "".join(pm.itertext())
                if target_date and target_date not in text:
                    parent.remove(pm)
        return ET.tostring(root, encoding='utf-8').decode('utf-8')

    elif mode == "repair":
        try:
            root = ET.fromstring(file_content)
        except Exception as e:
            return f"Error parsing KML: {str(e)}"

        ns = {'kml': 'http://www.opengis.net/kml/2.2'}
        ET.register_namespace('', 'http://www.opengis.net/kml/2.2')

        for coords_elem in root.findall('.//kml:coordinates', ns):
            if coords_elem.text:
                valid = []
                for c in coords_elem.text.strip().split():
                    parts = c.split(',')
                    if len(parts) >= 2:
                        try:
                            valid.append(f"{float(parts[0])},{float(parts[1])},0")
                        except ValueError:
                            continue
                coords_elem.text = " ".join(valid)
        return ET.tostring(root, encoding='utf-8').decode('utf-8')

    elif mode == "split":
        try:
            root = ET.fromstring(file_content)
        except Exception as e:
            return f"Error parsing KML: {str(e)}"

        ns = {'kml': 'http://www.opengis.net/kml/2.2'}
        ET.register_namespace('', 'http://www.opengis.net/kml/2.2')

        for parent in root.findall('.//kml:Document', ns):
            for pm in list(parent.findall('kml:Placemark', ns)):
                coords_elem = pm.find('.//kml:coordinates', ns)
                if coords_elem is not None and coords_elem.text:
                    coords = coords_elem.text.strip().split()
                    if len(coords) > 200:
                        folder = ET.Element('{http://www.opengis.net/kml/2.2}Folder')
                        f_name = ET.SubElement(folder, '{http://www.opengis.net/kml/2.2}name')
                        f_name.text = "Splitted Tracks"
                        
                        chunk_size = 150
                        for i in range(0, len(coords), chunk_size):
                            sub_pm = ET.SubElement(folder, '{http://www.opengis.net/kml/2.2}Placemark')
                            sub_name = ET.SubElement(sub_pm, '{http://www.opengis.net/kml/2.2}name')
                            sub_name.text = f"Part {i//chunk_size + 1}"
                            ls = ET.SubElement(sub_pm, '{http://www.opengis.net/kml/2.2}LineString')
                            c_elem = ET.SubElement(ls, '{http://www.opengis.net/kml/2.2}coordinates')
                            c_elem.text = " ".join(coords[i:i+chunk_size])
                        
                        parent.remove(pm)
                        parent.append(folder)
        return ET.tostring(root, encoding='utf-8').decode('utf-8')

    return "Invalid mode"
`;

        let pyodide = null;
        let convertedData = "";
        let outputFileName = "output.kml";

        const statusEl = document.getElementById('status');
        const modeSelect = document.getElementById('modeSelect');
        const dateInputGroup = document.getElementById('dateInputGroup');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const actionArea = document.getElementById('actionArea');

        async function initPyodide() {
            try {
                pyodide = await loadPyodide();
                pyodide.runPython(pythonCoreScript);
                statusEl.className = "success";
                statusEl.innerText = "✅ Ready. Pyodide loaded.";
            } catch (err) {
                statusEl.className = "error";
                statusEl.innerText = "❌ Load failed: " + err.message;
            }
        }
        initPyodide();

        modeSelect.addEventListener('change', () => {
            dateInputGroup.style.display = (modeSelect.value === 'prune') ? 'block' : 'none';
        });

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('hover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        async function handleFile(file) {
            if (!file || !pyodide) return;

            const mode = modeSelect.value;
            const targetDate = document.getElementById('targetDate').value.trim();

            if (mode === 'prune' && !targetDate) {
                alert("Please fill in the target date filter.");
                return;
            }

            statusEl.className = "";
            statusEl.innerText = "⚙️ Processing...";
            actionArea.style.display = "none";

            setTimeout(async () => {
                try {
                    const content = await file.text();
                    
                    pyodide.globals.set("f_content", content);
                    pyodide.globals.set("f_mode", mode);
                    pyodide.globals.set("f_date", targetDate);

                    convertedData = pyodide.runPython("process_file(f_content, f_mode, f_date)");

                    if (convertedData.startsWith("Error")) {
                        throw new Error(convertedData);
                    }

                    outputFileName = file.name.replace(/\.[^/.]+$/, "") + `_${mode}.kml`;
                    statusEl.className = "success";
                    statusEl.innerText = `✅ Success! Output ready: ${outputFileName}`;
                    actionArea.style.display = "block";
                } catch (err) {
                    statusEl.className = "error";
                    statusEl.innerText = "❌ Error: " + err.message;
                }
            }, 50);
        }

        document.getElementById('downloadBtn').onclick = () => {
            const blob = new Blob([convertedData], { type: 'application/vnd.google-earth.kml+xml' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = outputFileName;
            a.click();
        };
    </script>
</body>
</html>
